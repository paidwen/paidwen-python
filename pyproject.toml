[project]
name = "paidwen"
version = "0.8.1"
description = "Paidwen SDK: the agent asks Paidwen before each action and applies the answer."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "anyio>=4",
    "httpx>=0.27,<1",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "typing-extensions>=4.12",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://paidwen.com/docs"
Repository = "https://github.com/paidwen/paidwen-python"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiohttp==3.14.3",
    "datamodel-code-generator==0.83.0",
    "mcp==2.3.0",
    "opentelemetry-proto>=1.30,<2",
    "pytest==9.1.1",
    "requests==2.34.2",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/paidwen/_contract.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
